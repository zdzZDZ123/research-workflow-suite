name: Test portable source
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r notion-workflows/requirements.txt
      - run: python -m pip install -e "./paper-format-plugin[test]"
      - run: python scripts/audit_public.py
      - run: python -m unittest discover -s notion-workflows -q
      - run: python scripts/run_tests.py
        working-directory: zotero-citation-sync
      - name: Install LibreOffice for real DOCX rendering tests
        run: choco install libreoffice-fresh -y --no-progress
      - run: python -m pytest paper-format-plugin/tests -q
      - run: node --test paper-format-plugin/tests/test_bridge.js
      - run: python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: portable-source
          path: dist/*.zip*
