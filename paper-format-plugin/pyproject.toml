[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zotero-paper-formatter"
version = "0.1.3"
description = "Local, recoverable manuscript formatting for Zotero"
requires-python = ">=3.12"
dependencies = ["lxml>=5.3,<7", "python-docx>=1.2,<2", "pypdf>=6,<7", "pypdfium2>=4.30,<6", "Pillow>=11,<13", "fonttools>=4.55,<5"]

[project.optional-dependencies]
pdf = ["docling>=2.141,<3", "rapidocr>=3.10,<4", "onnxruntime>=1.31,<2"]
test = ["pytest>=8,<10", "reportlab>=4,<5"]

[project.scripts]
paper-formatter = "paper_formatter.cli:main"

[tool.setuptools.packages.find]
include = ["paper_formatter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
